[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
  ### {{ group | striptags | trim | upper_first }}
  {% for commit in commits %}
    - {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))
  {% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^docs", group = "<!-- 2 -->Documentation" },
  { message = "^ci", group = "<!-- 3 -->CI" },
  { message = "^refactor", group = "<!-- 4 -->Changed" },
  { message = "^chore", group = "<!-- 5 -->Miscellaneous" },
]

[remote.github]
owner = "rtaylor02"
repo = "university_app"
