name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [config-server, eureka-server, auth-service, student-service, course-service, enrollment-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Check service exists
        id: exists
        run: |
          if [ -d "services/${{ matrix.service }}" ] || [ -d "infrastructure/${{ matrix.service }}" ]; then echo "dir=$(test -d services/${{ matrix.service }} && echo services/${{ matrix.service }} || echo infrastructure/${{ matrix.service }})" >> $GITHUB_OUTPUT; else echo "skip=true" >> $GITHUB_OUTPUT; fi
      - name: Set up JDK 25
        if: steps.exists.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        if: steps.exists.outputs.skip != 'true'
        working-directory: ${{ steps.exists.outputs.dir }}
        run: ./mvnw verify

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend exists
        id: exists
        run: |
          if [ -d "frontend" ]; then echo "skip=false" >> $GITHUB_OUTPUT; else echo "skip=true" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.exists.outputs.skip == 'false'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.exists.outputs.skip == 'false'
        working-directory: frontend
        run: npm ci
      - name: Lint / typecheck / test / build
        if: steps.exists.outputs.skip == 'false'
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
