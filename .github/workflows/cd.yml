name: CD

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: write

jobs:
  docker:
    name: Build & push images, deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push service images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.ref_name }}
        run: |
          for d in services/* infrastructure/*; do
            [ -f "$d/Dockerfile" ] || continue
            name=$(basename "$d")
            docker build -t "$REGISTRY/$name:$TAG" "$d"
            docker push "$REGISTRY/$name:$TAG"
          done

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/university_app
            docker compose pull
            docker compose up -d

      - name: Generate changelog
        uses: kenji-miyake/setup-git-cliff@v1

      - name: Update CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git-cliff -o CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${{ github.ref_name }}" || true
          git push origin main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
