name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventional-commits:
    name: PR title follows Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        run: |
          title="${{ github.event.pull_request.title }}"
          if ! echo "$title" | grep -qE '^(feat|fix|docs|chore|ci|refactor|test|perf|style|build|revert)(\(.+\))?: .+'; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: add student endpoint'"
            exit 1
          fi
